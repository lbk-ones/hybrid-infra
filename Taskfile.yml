version: '3'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

vars:
  APP_NAME: "hybrid-infra"
  BIN_DIR: "bin"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 5173}}'

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  hybrid:
    summary: Generate cracked packages for remote webpage import
    cmds:
      - wails3 generate bindings
      - wails3 generate runtime
      - |
        rm -rf hybrid
        mkdir -p hybrid
        mv runtime.js hybrid/
        mv runtime-debug.js hybrid/
        cp -r frontend/bindings hybrid/
        # 区分 Linux/Mac 系统的 sed -i 参数
        SED_I_PARAM=""
        if [[ "$OSTYPE" == "darwin"* ]]; then
        # Mac 系统（BSD sed）需要加空参数
        SED_I_PARAM="-i ''"
        else
        # Linux 系统（GNU sed）
        SED_I_PARAM="-i"
        fi
        # 替换 window.location.origin
        sed $SED_I_PARAM 's/window.location.origin/"http:\/\/wails.localhost"/' hybrid/runtime.js
        sed $SED_I_PARAM 's/window.location.origin/"http:\/\/wails.localhost"/' hybrid/runtime-debug.js
        # ===================== 配置区（修改这里）=====================
        TARGET_DIR="hybrid"       # 要处理的目标文件夹（可改为绝对路径，如 /home/user/files）
        OLD_STR="@wailsio/runtime"  # 要替换的旧字符串
        NEW_STR="/hybrid/runtime.js"  # 新字符串（双引号已正确转义）
        FILE_PATTERN="*.js"            # 匹配的文件类型（* 表示所有文件，可改为 *.js 仅处理js文件）
        # ============================================================ 
        # 安全校验：检查目标文件夹是否存在
        if [ ! -d "$TARGET_DIR" ]; then
        echo "错误：目标文件夹 $TARGET_DIR 不存在！"
        exit 1
        fi 
        # 遍历文件夹下的所有匹配文件（递归处理子文件夹加 -r 参数）
        echo "开始替换：文件夹=$TARGET_DIR，旧字符串=$OLD_STR，新字符串=$NEW_STR"
        find "$TARGET_DIR" -type f -name "$FILE_PATTERN" | while read -r file; do
        file=$(echo "$file" | sed 's/\\/\//g')
        # echo "file path is --> $file"
        # 用 # 作为分隔符，避免 / 转义问题
        eval sed $SED_I_PARAM "s#$OLD_STR#$NEW_STR#g" "$file"
        # echo "已处理文件：$file"
        done
        echo "✅ 已生成hybrid文件夹!"
