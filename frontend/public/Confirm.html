<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>操作确认</title>
    <link rel="stylesheet" href="/dialog.css" />
    <script src="/wails/runtime.js" type="module"></script>
  </head>
  <body class="native-dialog">
    <div id="confirm-id"></div>
    <div
      id="hybrid-confirm-container"
      class="dialog-shell"
      role="dialog"
      aria-labelledby="hybrid-confirm-ac-title"
      aria-describedby="hybrid-confirm-ac-body"
    >
      <div id="hybrid-confirm-container-top" class="dialog-top">
        <span class="dialog-icon" aria-hidden="true">?</span>
        <div id="hybrid-confirm-ac-right" class="dialog-copy">
          <div id="hybrid-confirm-ac-title" class="dialog-title">确认</div>
          <div id="hybrid-confirm-ac-body" class="dialog-body">是否确认</div>
        </div>
      </div>
      <div class="dialog-actions">
        <button id="confirm-cancel" class="btn-cancel" autofocus>取消</button
        ><button id="confirm-confirm" class="btn">确认</button>
      </div>
    </div>
    <script>
      // 向当前确认框专属事件回复 1 或 0；没有事件标识时只关闭窗口，供独立预览使用。
      function answer(value) {
        const event = document.getElementById("confirm-id").textContent;
        if (event) window.wails.Events.Emit(event, value);
        else window.wails.Window.Close();
      }
      document
        .getElementById("confirm-confirm")
        .addEventListener("click", () => answer("1"));
      document
        .getElementById("confirm-cancel")
        .addEventListener("click", () => answer("0"));
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") answer("0");
      });
    </script>
  </body>
</html>
