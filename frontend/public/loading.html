<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>正在加载 · Hybrid</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        background: #f6f8f7;
        display: grid;
        place-items: center;
        font:
          13px/1.6 "Segoe UI",
          "Microsoft YaHei",
          sans-serif;
        color: #6b8574;
      }
      .loading {
        text-align: center;
      }
      .mark {
        display: grid;
        place-items: center;
        margin: 0 auto 23px;
        width: 52px;
        height: 52px;
        border-radius: 15px;
        background: #21765e;
        color: white;
        font-size: 27px;
      }
      .loader {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin: 18px;
      }
      .loader i {
        width: 6px;
        height: 6px;
        background: #5a9e7e;
        border-radius: 50%;
        animation: pulse 1.4s ease-in-out infinite;
      }
      .loader i:nth-child(2) {
        animation-delay: 0.15s;
      }
      .loader i:nth-child(3) {
        animation-delay: 0.3s;
      }
      p {
        margin: 0;
      }
      small {
        font-size: 10px;
        color: #8da395;
      }
      @keyframes pulse {
        0%,
        80%,
        100% {
          opacity: 0.3;
          transform: translateY(0);
        }
        40% {
          opacity: 1;
          transform: translateY(-5px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .loader i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="loading" role="status" aria-live="polite">
      <div class="mark" aria-hidden="true">h↗</div>
      <p>正在连接你的工作空间</p>
      <small>即刻就绪，请稍候</small>
      <div class="loader" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
  </body>
</html>
