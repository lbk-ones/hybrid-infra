<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>消息提示</title>
    <link rel="stylesheet" href="/dialog.css" />
    <script src="/wails/runtime.js" type="module"></script>
  </head>
  <body class="native-dialog">
    <div
      id="hybrid-alert-container"
      class="dialog-shell"
      role="alert"
      aria-labelledby="hybrid-ac-title"
    >
      <div class="bar" aria-hidden="true"></div>
      <div id="hybrid-alert-container-top" class="dialog-top">
        <span class="dialog-icon" aria-hidden="true">i</span>
        <div id="hybrid-ac-right" class="dialog-copy">
          <div id="hybrid-ac-title" class="dialog-title">提示</div>
          <div id="hybrid-ac-body" class="dialog-body">提示内容</div>
        </div>
      </div>
      <div class="dialog-actions">
        <button class="btn" wml-window="Close" autofocus>知道了</button>
      </div>
    </div>
  </body>
</html>
