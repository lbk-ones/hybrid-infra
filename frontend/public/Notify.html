<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>应用通知</title>
    <link rel="stylesheet" href="/dialog.css" />
  </head>
  <body class="native-dialog">
    <section class="dialog-shell notification-shell" role="status" aria-live="polite">
      <div class="bar" aria-hidden="true"></div>
      <span class="dialog-icon notification-icon" aria-hidden="true">✓</span>
      <div id="hybrid-notify-text" class="notification-text"></div>
      <button id="notification-close" class="notification-close" aria-label="关闭通知">×</button>
    </section>
    <script type="module" src="/notify.js"></script>
  </body>
</html>
